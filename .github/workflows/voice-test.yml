name: synthetic-reference-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'qwen-tts==0.1.1' 'torch==2.8.0' soundfile
      - run: python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-references
          path: synthetic-references/*.wav
          retention-days: 1
