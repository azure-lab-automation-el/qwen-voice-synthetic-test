name: "בדיקת קול כסוף בעברית - יצירה, תמלול ותוצאות"
run-name: "בדיקת עברית בקול הכסוף (שלב ${{ inputs.phase }})"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "שלב: references או hebrew"
        required: true
        default: hebrew
        type: choice
        options: [hebrew, references, mysterious, image-bootstrap, image-build, image-build-v2, image-build-v3]
permissions:
  contents: read
  actions: read
jobs:
  hebrew:
    if: inputs.phase == 'hebrew'
    name: "הדגמת הקול הכסוף בעברית"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. הורדת מודל עברית וכלי יצירה"
        run: |
          set -euo pipefail
          translate_log() {
            sed -u \
              -e 's/^Reading database/קורא מסד נתונים/' \
              -e 's/^Reading package lists/קורא רשימות חבילות/' \
              -e 's/^Building dependency tree/בונה עץ תלויות/' \
              -e 's/^Reading state information/קורא מצב חבילות/' \
              -e 's/^Selecting previously unselected package/בוחר חבילה חדשה/' \
              -e 's/^Preparing to unpack/מתכונן לפריסה/' \
              -e 's/^Unpacking/פורס/' \
              -e 's/^Setting up/מגדיר/' \
              -e 's/^Processing triggers for/מעבד טריגרים עבור/' \
              -e 's/^Get:/מוריד מקור:/' \
              -e 's/^Fetched /הורדו /' \
              -e 's/^Downloading /מוריד /' \
              -e 's/^Installing collected packages:/מתקין חבילות:/' \
              -e 's/^Successfully installed /הותקנו בהצלחה /' \
              -e 's/^Collecting /אוסף /'
          }
          echo "⏳ מתקינה כלי בנייה ובדיקת אודיו..."
          sudo apt-get update 2>&1 | translate_log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential libsndfile1 ffmpeg 2>&1 | translate_log
          echo "✅ כלי הבנייה והאודיו הותקנו"
          echo "⏳ בונה מנוע קול עברי..."
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/ServeurpersoCom/qwentts.cpp.git qwentts
          cmake -S qwentts -B qwentts/build -DGGML_BLAS=OFF -DCMAKE_BUILD_TYPE=Release 2>&1 | translate_log
          cmake --build qwentts/build -j 2 2>&1 | translate_log
          echo "✅ מנוע הקול נבנה"
          mkdir -p models
          echo "⬇️ מורידה מודל עברית (כ-1.5GB)..."
          curl -fsSL --retry 3 -o models/talker.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-talker-1.7b-base-Q4_K_M.gguf
          curl -fsSL --retry 3 -o models/codec.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-tokenizer-12hz-Q4_K_M.gguf
          echo "✅ מודל העברית מוכן"
          echo "מודל העברית וכלי היצירה מוכנים" >> "$GITHUB_STEP_SUMMARY"
      - name: "3. הורדת הקול הכסוף שנוצר בניסוי"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/10913764092/zip > references.zip
          unzip -p references.zip silver.wav > silver.wav
          printf '%s\n' 'The quiet signal was hidden beneath the noise. Now we know where to look.' > silver.txt
          echo "⏳ בודקת את דגימת הקול הכסוף..."
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 silver.wav
          echo "✅ הקול הכסוף מוכן"
          echo "דגימת קול מקורית: silver.wav (5.44 שניות)" >> "$GITHUB_STEP_SUMMARY"
      - name: "4. יצירת גרסאות קול והשוואת תמלול"
        run: |
          set -euo pipefail
          echo "⏳ מתקינה כלי תמלול והשוואה..."
          pip install --disable-pip-version-check -q soundfile faster-whisper
          echo "⏳ מריצה 12 גרסאות הגייה ודגימת מקור..."
          python generate.py compare-variants
          echo "✅ ההשוואה הסתיימה, בדיקת מבטא מחייבת האזנה"
          cat hebrew-output/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: "5. העלאת שלוש הדגימות המובילות והטבלה"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-silver-variants
          path: |
            hebrew-output/*.ogg
            hebrew-output/results.md
          if-no-files-found: warn
          retention-days: 1
  bootstrap:
    if: inputs.phase == 'image-bootstrap'
    name: "יצירת חבילת פתיחה קטנה לאימג׳ ציבורי"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: "1. בניית אימג׳ מינימלי ללא נתוני משתמש"
        run: |
          set -euo pipefail
          mkdir -p /tmp/voice-image-empty
          printf 'FROM alpine:3.20\nRUN true\n' > /tmp/voice-image-empty/Dockerfile
          docker build --pull -t ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap /tmp/voice-image-empty
      - name: "2. העלאת חבילת הפתיחה בלבד"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap
          docker image inspect ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap --format '{{.Size}} bytes local image'
  image:
    if: inputs.phase == 'image-build'
    name: "בניית אימג׳ ציבורי שנבדק ללא מידע פרטי"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: "1. הכנת Dockerfile ובדיקת היעדר נתונים פרטיים"
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-voice-image
          cat > /tmp/public-voice-image/Dockerfile <<'DOCKERFILE'
          FROM python:3.12-slim-bookworm
          LABEL org.opencontainers.image.description="Public open-source synthetic Hebrew voice runtime; no user data or generated audio."
          ENV DEBIAN_FRONTEND=noninteractive PIP_NO_CACHE_DIR=1
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates curl git cmake build-essential libsndfile1 ffmpeg unzip \
              && rm -rf /var/lib/apt/lists/*
          RUN python -m pip install --no-cache-dir 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu \
              && python -m pip install --no-cache-dir 'qwen-tts==0.1.1' soundfile faster-whisper 'renikud-plus==0.5.0'
          RUN git clone -q https://github.com/ServeurpersoCom/qwentts.cpp.git /opt/qwentts \
              && git -C /opt/qwentts checkout -q 6a3e91283220197bad2ae1eb40ae1c1392bfd820 \
              && git -C /opt/qwentts submodule update --init --recursive -q \
              && cmake -S /opt/qwentts -B /opt/qwentts/build -DGGML_BLAS=OFF -DCMAKE_BUILD_TYPE=Release \
              && cmake --build /opt/qwentts/build -j 2 \
              && rm -rf /opt/qwentts/.git /opt/qwentts/build/_deps
          RUN mkdir -p /opt/models \
              && curl -fsSL --retry 3 -o /opt/models/talker.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-talker-1.7b-base-Q4_K_M.gguf \
              && curl -fsSL --retry 3 -o /opt/models/codec.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-tokenizer-12hz-Q4_K_M.gguf \
              && test "$(wc -c </opt/models/talker.gguf)" -gt 1000000000 \
              && test "$(wc -c </opt/models/codec.gguf)" -gt 200000000
          ENV PATH="/opt/qwentts/build:${PATH}"
          WORKDIR /workspace
          DOCKERFILE
          echo "✅ הקונטקסט מכיל Dockerfile יחיד; אין העתקת קבצים או סודות לתמונה"
          find /tmp/public-voice-image -maxdepth 1 -type f -printf '%f\n'
      - name: "2. בניית אימג׳ מהכלים והמודלים הפתוחים בלבד"
        run: |
          set -euo pipefail
          docker build --pull -t ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v1 /tmp/public-voice-image
          docker history --no-trunc ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v1 | head -35
          docker run --rm ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v1 sh -c 'test -x /opt/qwentts/build/qwen-tts && test -s /opt/models/talker.gguf && test -s /opt/models/codec.gguf && ffmpeg -version >/dev/null && python -c "import qwen_tts, faster_whisper, soundfile; print(\"runtime imports pass\")"'
      - name: "3. העלאה לחבילה הציבורית שכבר אומתה"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v1
          echo "✅ אימג׳ runtime-v1 הועלה; את הדיג׳סט קובעים מקריאת החבילה" >> "$GITHUB_STEP_SUMMARY"
  image_v2:
    if: inputs.phase == 'image-build-v2'
    name: "אפיית מודל הניקוד לאימג׳ ציבורי v2"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: "1. בניית שכבה עם מודל הניקוד הפתוח בלבד"
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-voice-v2
          cat > /tmp/public-voice-v2/Dockerfile <<'DOCKERFILE'
          FROM ghcr.io/azure-lab-automation-el/synthetic-voice-runtime@sha256:b5d985247e58bc0dac9c91dd5bb66321526601465c87b88b4ba57af4425c2607
          RUN mkdir -p /opt/models/renikud \
              && curl -fsSL --retry 3 -o /opt/models/renikud/model.onnx https://huggingface.co/notmax123/RenikudPlus/resolve/main/model.onnx \
              && test "$(wc -c </opt/models/renikud/model.onnx)" -gt 100000000
          RUN python -c "from renikud_onnx import G2P; g=G2P(model_path='/opt/models/renikud/model.onnx',niqqud='use',datastore=None); print(g.phonemize('סוֹד',speaker=2,target_speaker=2))"
          DOCKERFILE
          docker build -t ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v2 /tmp/public-voice-v2
          docker history --no-trunc ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v2 | head -30
          echo "✅ מודל ONNX אומת מתוך האימג׳ ללא הורדה בזמן ריצה"
      - name: "2. העלאת אימג׳ v2 הציבורי"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v2
          echo "✅ runtime-v2 הועלה; דיג׳סט ייקבע מקריאת החבילה" >> "$GITHUB_STEP_SUMMARY"
  image_v3:
    if: inputs.phase == 'image-build-v3'
    name: "בניית אימג׳ קומפקטי עם מנוע נייד לכל מעבד"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: "1. בניית מנוע נייד והפרדת סביבת הרצה"
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-voice-v3
          cat > /tmp/public-voice-v3/Dockerfile <<'DOCKERFILE'
          FROM ghcr.io/azure-lab-automation-el/synthetic-voice-runtime@sha256:2dd4bd75ad4c601d5525bd816bbb26d0001563cec33e7cb163d229fe190c3bb2 AS builder
          RUN cmake -S /opt/qwentts -B /opt/qwentts/build-portable -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX2=OFF -DGGML_AVX=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_SSE42=OFF -DGGML_BLAS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-march=x86-64' -DCMAKE_CXX_FLAGS='-march=x86-64' \
              && cmake --build /opt/qwentts/build-portable -j 2 --target qwen-tts
          FROM python:3.12-slim-bookworm
          LABEL org.opencontainers.image.description="Public portable synthetic Hebrew voice runtime; no user data."
          RUN apt-get update && apt-get install -y --no-install-recommends libsndfile1 ffmpeg libgomp1 ca-certificates curl unzip \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /usr/local/lib/python3.12/site-packages /usr/local/lib/python3.12/site-packages
          COPY --from=builder /opt/models /opt/models
          COPY --from=builder /opt/qwentts/build-portable/ /opt/qwentts/build/
          ENV PATH="/opt/qwentts/build:${PATH}"
          WORKDIR /workspace
          RUN test -x /opt/qwentts/build/qwen-tts && test -s /opt/models/renikud/model.onnx \
              && python -c "from renikud_onnx import G2P; print(G2P(model_path='/opt/models/renikud/model.onnx',niqqud='use',datastore=None).phonemize('סוֹד',speaker=2,target_speaker=2))" \
              && ( /opt/qwentts/build/qwen-tts --help > /tmp/qwen-help.txt 2>&1; code=$?; cat /tmp/qwen-help.txt; test "$code" -eq 1; grep -q "Usage:" /tmp/qwen-help.txt )
          DOCKERFILE
          docker build -t ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v3 /tmp/public-voice-v3
          docker image inspect ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v3 --format 'local bytes={{.Size}}'
          docker history ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v3 | head -25
      - name: "2. העלאת אימג׳ ציבורי נייד v3"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:runtime-v3
          echo "✅ גרסה 3 נדחפה; יש לבדוק הרצת סינתזה אמיתית לפני אימוץ" >> "$GITHUB_STEP_SUMMARY"
  mysterious:
    if: inputs.phase == 'mysterious'
    name: "שלוש גרסאות מסתוריות של הקול הכסוף"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/azure-lab-automation-el/synthetic-voice-runtime@sha256:b5d985247e58bc0dac9c91dd5bb66321526601465c87b88b4ba57af4425c2607
    defaults:
      run:
        shell: bash
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. שחזור שלוש דגימות המקור השמורות"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "⏳ משחזרת שלוש דגימות מקור קבועות מההרצה הקודמת..."
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10915802171/zip" -o references.zip
          unzip -oq references.zip 'mysterious-references/*'
          for name in velvet moon secret; do
            test -s "mysterious-references/$name.wav"
            sha256sum "mysterious-references/$name.wav"
          done
          echo "✅ שלוש דגימות מקור זהות לשמורות, ללא יצירת קול חדשה"
      - name: "3. שימוש במנוע ובמודל מוכנים מתוך אימג׳ ציבורי"
        run: |
          set -euo pipefail
          test -x /opt/qwentts/build/qwen-tts
          test -s /opt/models/talker.gguf
          test -s /opt/models/codec.gguf
          echo "✅ מנוע ומודל עברי נמצאים באימג׳, ללא התקנה או הורדה"
      - name: "4. יצירת הגייה ובדיקת שלוש דגימות שונות"
        run: |
          set -euo pipefail
          mkdir -p mysterious-output
          python - <<'PY_G2P'
          from renikud_onnx import G2P
          from pathlib import Path
          text='יֵשׁ לִי סוֹד קָטָן... וַאֲנִי אֲגַלֶּה לְךָ אוֹתוֹ רַק בְּסוֹף הַשִּׁיעוּר.'
          g2p=G2P(niqqud='use',datastore=None)
          ipa=g2p.phonemize(text,speaker=2,target_speaker=2)
          print('IPA verified from pointed Hebrew:',ipa)
          Path('mysterious-output/prompt.ipa').write_text(ipa,encoding='utf-8')
          PY_G2P
          python generate.py mysterious-hebrew
          cat mysterious-output/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: "5. העלאת הדגימות וטבלת ההבנה"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silver-mysterious-hebrew
          path: |
            mysterious-output/*.ogg
            mysterious-output/results.md
            mysterious-output/prompt.ipa
            mysterious-references/*.wav
            mysterious-references/*.txt
          if-no-files-found: warn
          retention-days: 1
  references:
    if: inputs.phase == 'references'
    name: "יצירת שלוש דגימות מקור באנגלית"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. הכנת פייתון ומטמון מודל"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen-voice-design-1.7b-v1
      - name: "3. התקנת כלים וגרסאות CPU"
        run: |
          pip install 'qwen-tts==0.1.1' soundfile
          pip install --force-reinstall 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: "4. יצירת שלוש דגימות סינתטיות"
        run: python generate.py references
      - name: "5. העלאת דגימות המקור"
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-references
          path: synthetic-references/*.wav
          retention-days: 1
