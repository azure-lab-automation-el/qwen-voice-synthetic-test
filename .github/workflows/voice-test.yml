name: synthetic-reference-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen-voice-design-1.7b-v1
      - run: pip install 'qwen-tts==0.1.1' soundfile
      - run: pip install --force-reinstall 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -c 'import torch,torchaudio; print(torch.__version__, torchaudio.__version__)'
      - run: python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-references
          path: synthetic-references/*.wav
          retention-days: 1
