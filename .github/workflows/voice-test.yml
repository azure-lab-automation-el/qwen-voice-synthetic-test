name: "בדיקת קול כסוף בעברית - יצירה, תמלול ותוצאות"
run-name: "בדיקת עברית בקול הכסוף (שלב ${{ inputs.phase }})"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "שלב: references או hebrew"
        required: true
        default: hebrew
        type: choice
        options: [hebrew, references, mysterious, image-bootstrap]
permissions:
  contents: read
  actions: read
jobs:
  hebrew:
    if: inputs.phase == 'hebrew'
    name: "הדגמת הקול הכסוף בעברית"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. הורדת מודל עברית וכלי יצירה"
        run: |
          set -euo pipefail
          translate_log() {
            sed -u \
              -e 's/^Reading database/קורא מסד נתונים/' \
              -e 's/^Reading package lists/קורא רשימות חבילות/' \
              -e 's/^Building dependency tree/בונה עץ תלויות/' \
              -e 's/^Reading state information/קורא מצב חבילות/' \
              -e 's/^Selecting previously unselected package/בוחר חבילה חדשה/' \
              -e 's/^Preparing to unpack/מתכונן לפריסה/' \
              -e 's/^Unpacking/פורס/' \
              -e 's/^Setting up/מגדיר/' \
              -e 's/^Processing triggers for/מעבד טריגרים עבור/' \
              -e 's/^Get:/מוריד מקור:/' \
              -e 's/^Fetched /הורדו /' \
              -e 's/^Downloading /מוריד /' \
              -e 's/^Installing collected packages:/מתקין חבילות:/' \
              -e 's/^Successfully installed /הותקנו בהצלחה /' \
              -e 's/^Collecting /אוסף /'
          }
          echo "⏳ מתקינה כלי בנייה ובדיקת אודיו..."
          sudo apt-get update 2>&1 | translate_log
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential libsndfile1 ffmpeg 2>&1 | translate_log
          echo "✅ כלי הבנייה והאודיו הותקנו"
          echo "⏳ בונה מנוע קול עברי..."
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/ServeurpersoCom/qwentts.cpp.git qwentts
          cmake -S qwentts -B qwentts/build -DGGML_BLAS=OFF -DCMAKE_BUILD_TYPE=Release 2>&1 | translate_log
          cmake --build qwentts/build -j 2 2>&1 | translate_log
          echo "✅ מנוע הקול נבנה"
          mkdir -p models
          echo "⬇️ מורידה מודל עברית (כ-1.5GB)..."
          curl -fsSL --retry 3 -o models/talker.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-talker-1.7b-base-Q4_K_M.gguf
          curl -fsSL --retry 3 -o models/codec.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-tokenizer-12hz-Q4_K_M.gguf
          echo "✅ מודל העברית מוכן"
          echo "מודל העברית וכלי היצירה מוכנים" >> "$GITHUB_STEP_SUMMARY"
      - name: "3. הורדת הקול הכסוף שנוצר בניסוי"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/10913764092/zip > references.zip
          unzip -p references.zip silver.wav > silver.wav
          printf '%s\n' 'The quiet signal was hidden beneath the noise. Now we know where to look.' > silver.txt
          echo "⏳ בודקת את דגימת הקול הכסוף..."
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 silver.wav
          echo "✅ הקול הכסוף מוכן"
          echo "דגימת קול מקורית: silver.wav (5.44 שניות)" >> "$GITHUB_STEP_SUMMARY"
      - name: "4. יצירת גרסאות קול והשוואת תמלול"
        run: |
          set -euo pipefail
          echo "⏳ מתקינה כלי תמלול והשוואה..."
          pip install --disable-pip-version-check -q soundfile faster-whisper
          echo "⏳ מריצה 12 גרסאות הגייה ודגימת מקור..."
          python generate.py compare-variants
          echo "✅ ההשוואה הסתיימה, בדיקת מבטא מחייבת האזנה"
          cat hebrew-output/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: "5. העלאת שלוש הדגימות המובילות והטבלה"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-silver-variants
          path: |
            hebrew-output/*.ogg
            hebrew-output/results.md
          if-no-files-found: warn
          retention-days: 1
  bootstrap:
    if: inputs.phase == 'image-bootstrap'
    name: "יצירת חבילת פתיחה קטנה לאימג׳ ציבורי"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: "1. בניית אימג׳ מינימלי ללא נתוני משתמש"
        run: |
          set -euo pipefail
          mkdir -p /tmp/voice-image-empty
          printf 'FROM alpine:3.20\nRUN true\n' > /tmp/voice-image-empty/Dockerfile
          docker build --pull -t ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap /tmp/voice-image-empty
      - name: "2. העלאת חבילת הפתיחה בלבד"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap
          docker image inspect ghcr.io/azure-lab-automation-el/synthetic-voice-runtime:bootstrap --format '{{.Size}} bytes local image'
  mysterious:
    if: inputs.phase == 'mysterious'
    name: "שלוש גרסאות מסתוריות של הקול הכסוף"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. שחזור חבילות ומודלים מהמטמון"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/pip
            models
            qwentts
          key: mystery-hebrew-ubuntu24-py311-qwen01-gguf-6a3e9128-v1
      - name: "3. יצירת שלוש דגימות מקור כסופות ומסתוריות"
        run: |
          set -euo pipefail
          echo "⏳ מתקינה מנוע עיצוב קול סינתטי..."
          python -m pip install -q 'qwen-tts==0.1.1' soundfile
          python -m pip install -q 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          echo "⏳ יוצרת שלוש דמויות קול בדיוניות..."
          python generate.py mysterious-references
          echo "✅ שלוש דגימות קול סינתטיות מוכנות" >> "$GITHUB_STEP_SUMMARY"
      - name: "4. התקנת מנוע עברית ומודל"
        run: |
          set -euo pipefail
          echo "⏳ מתקינה כלי שמע ובנייה..."
          if ! command -v ffmpeg >/dev/null || ! command -v cmake >/dev/null || ! ldconfig -p | grep -q libsndfile; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake build-essential libsndfile1 ffmpeg
          else
            echo "✅ כלי מערכת כבר זמינים, ללא הורדה"
          fi
          if [ ! -x qwentts/build/qwen-tts ]; then
            if [ ! -f qwentts/CMakeLists.txt ]; then
              git clone -q https://github.com/ServeurpersoCom/qwentts.cpp.git qwentts
              git -C qwentts checkout -q 6a3e91283220197bad2ae1eb40ae1c1392bfd820
              git -C qwentts submodule update --init --recursive -q
            fi
            cmake -S qwentts -B qwentts/build -DGGML_BLAS=OFF -DCMAKE_BUILD_TYPE=Release >/tmp/cmake.log 2>&1 || { cat /tmp/cmake.log; exit 1; }
            cmake --build qwentts/build -j 2 >/tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
          else
            echo "✅ מנוע עברית שוחזר מהמטמון, ללא בנייה"
          fi
          mkdir -p models
          echo "⬇️ מורידה מודל עברית (כ-1.5GB)..."
          if [ ! -s models/talker.gguf ]; then
            curl -fsSL --retry 3 -o models/talker.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-talker-1.7b-base-Q4_K_M.gguf
          else
            echo "✅ משקלי דיבור עבריים שוחזרו מהמטמון"
          fi
          if [ ! -s models/codec.gguf ]; then
            curl -fsSL --retry 3 -o models/codec.gguf https://huggingface.co/notmax123/QwenTTS-he-1.7B-GGUF/resolve/main/qwen-tokenizer-12hz-Q4_K_M.gguf
          else
            echo "✅ מקודד שמע שוחזר מהמטמון"
          fi
          echo "✅ מודל העברית מוכן" >> "$GITHUB_STEP_SUMMARY"
      - name: "5. משפט עברי מסתורי ובדיקת שלוש דגימות שונות"
        run: |
          set -euo pipefail
          pip install -q faster-whisper
          python generate.py mysterious-hebrew
          cat mysterious-output/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: "6. העלאת הדגימות וטבלת ההבנה"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silver-mysterious-hebrew
          path: |
            mysterious-output/*.ogg
            mysterious-output/results.md
          if-no-files-found: warn
          retention-days: 1
  references:
    if: inputs.phase == 'references'
    name: "יצירת שלוש דגימות מקור באנגלית"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. משיכת קוד הניסוי"
        uses: actions/checkout@v4
      - name: "2. הכנת פייתון ומטמון מודל"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen-voice-design-1.7b-v1
      - name: "3. התקנת כלים וגרסאות CPU"
        run: |
          pip install 'qwen-tts==0.1.1' soundfile
          pip install --force-reinstall 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: "4. יצירת שלוש דגימות סינתטיות"
        run: python generate.py references
      - name: "5. העלאת דגימות המקור"
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-references
          path: synthetic-references/*.wav
          retention-days: 1
